<!DOCTYPE html>
<html>
<head>
  <title>Indian Tricolor Flag</title>
</head>
<body>

<h2>Indian National Flag</h2>

<svg width="400" height="200">
  <!-- Saffron -->
  <rect width="400" height="66" y="0" fill="orange" />
  
  <!-- White -->
  <rect width="400" height="66" y="66" fill="white" />
  
  <!-- Green -->
  <rect width="400" height="66" y="132" fill="green" />

  <!-- Ashok Chakra (simple blue circle) -->
  <circle cx="200" cy="99" r="30" stroke="blue" stroke-width="2" fill="blue" />
</svg>

</body>
</html>
