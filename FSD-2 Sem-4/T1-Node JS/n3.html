<!-- write code to increses the font side at interval of 50ms and it should stop increseing when the font size reach to 50px
default font size=> 15px. This task should be performed when you click on increase button -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="p1" style="font-size: 15px;">Hello</p>
    <button onclick="increase()">Increase</button>
    <script>
        function increase(){
        setInterval(()=>{
            f=15;
            p=document.getElementById("p1").innerHTML;
            while(f<50){
                p.style.fontSize=f++;
            }
        },1000);
    }

    </script>
</body>
</html>
